name: tests

on:
  push:
    branches: [main]
  pull_request:

env:
  # The Hermes commit this backend is verified against. The plugin terminal
  # backend API does not exist in any PyPI release (latest is 0.19.0 and has no
  # agent/terminal_env_registry.py), so integration must come from git.
  #
  # Bump this DELIBERATELY. The shim in autoload/ depends on Hermes internals
  # that carry no compatibility guarantee; moving this pin is how we find out
  # an upstream change broke it, which is the entire point of the job below.
  HERMES_REF: 657ee57a99bf1c29936c8e4d5078695c911bc1b1

jobs:
  unit:
    name: unit (stdlib only)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No install step: the plugin and its unit tests are standard library only.
      # Scoped to test_unit.py on purpose. This job has no Hermes, so the
      # integration suite would SKIP here, and a skipped test reports success
      # while checking nothing. It is run for real by the job below.
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_unit.py" -v

  integration:
    name: integration (real Hermes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check out pinned Hermes
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" checkout --detach "$HERMES_REF"

      - name: Verify the pin actually contains the plugin backend API
        # Guards against a silent no-op: if this file is absent the whole
        # feature under test does not exist at this ref, and every probe below
        # would fail for a reason that has nothing to do with our code.
        run: |
          test -f "$RUNNER_TEMP/hermes-agent/agent/terminal_env_registry.py" \
            || { echo "::error::pinned Hermes $HERMES_REF has no agent/terminal_env_registry.py"; exit 1; }
          test -f "$RUNNER_TEMP/hermes-agent/hermes_cli/plugins.py" \
            || { echo "::error::pinned Hermes $HERMES_REF has no hermes_cli/plugins.py"; exit 1; }

      - name: Install Hermes's dependencies
        # Hermes itself cannot be pip-installed: its build backend refuses
        # outright ("Building wheels or sdists for hermes-agent is not
        # supported" -- it is built with Nix/uv2nix). So install its own pinned
        # dependency set and import Hermes from the checkout instead, which is
        # how the tests already run (cwd = HERMES_AGENT_PATH).
        run: |
          python - "$RUNNER_TEMP/hermes-agent/pyproject.toml" > "$RUNNER_TEMP/hermes-reqs.txt" <<'PY'
          import sys, tomllib
          with open(sys.argv[1], "rb") as fh:
              print("\n".join(tomllib.load(fh)["project"]["dependencies"]))
          PY
          test -s "$RUNNER_TEMP/hermes-reqs.txt" \
            || { echo "::error::parsed no dependencies from Hermes pyproject"; exit 1; }
          echo "Installing $(wc -l < "$RUNNER_TEMP/hermes-reqs.txt") pinned Hermes dependencies"
          python -m pip install --quiet -r "$RUNNER_TEMP/hermes-reqs.txt"

      - name: Integration tests
        env:
          HERMES_AGENT_PATH: ${{ runner.temp }}/hermes-agent
          # Turns "no Hermes, skip everything" into a hard failure. Without
          # this the suite silently goes inert and the job reports success over
          # tests that never ran -- which is exactly how it first shipped.
          KRUTRIM_REQUIRE_HERMES: "1"
        run: |
          set -o pipefail
          python -m unittest tests.test_hermes_integration -v 2>&1 \
            | tee "$RUNNER_TEMP/integration.log"

      - name: Assert the suite actually ran
        # Reads the log from the step above rather than re-running the suite.
        # An earlier version re-ran it and only grepped for "skipped", so it
        # reported success while the real run was failing -- a check that
        # could not fail, guarding against checks that cannot fail.
        if: always()
        run: |
          log="$RUNNER_TEMP/integration.log"
          test -f "$log" \
            || { echo "::error::no integration log -- the suite never ran"; exit 1; }
          grep -qE "^Ran [1-9][0-9]* tests" "$log" \
            || { echo "::error::integration suite ran no tests"; exit 1; }
          if grep -q "skipped" "$log"; then
            echo "::error::integration tests skipped; they must run in CI"
            exit 1
          fi
          echo "integration suite ran with no skips"
