[project]
name = "krutrim-hermes-backend"
version = "0.2.0"
description = "Ola Krutrim Cloud Sandbox as a Hermes terminal execution backend."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ola Krutrim" }]
keywords = ["krutrim", "hermes", "sandbox", "agent", "terminal"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
# No runtime dependencies by design: the backend speaks four REST endpoints over
# the standard library rather than pulling an SDK into a Hermes user's environment.
dependencies = []

# Hermes discovers entry-point plugins in this group. Without it a pip install
# is invisible to `hermes plugins list` no matter how correct the package is.
[project.entry-points."hermes_agent.plugins"]
krutrim = "krutrim"

[project.urls]
Homepage = "https://cloud.olakrutrim.com"
Source = "https://github.com/ola-krutrim/krutrim-hermes-backend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["krutrim"]

# Ships the startup shim into site-packages: the module plus the .pth that
# imports it at interpreter start. See autoload/krutrim_hermes_autoload.py for
# why a plugin backend needs this and a browser or tool plugin does not.
[tool.hatch.build.targets.wheel.force-include]
"autoload/krutrim_hermes_autoload.py" = "krutrim_hermes_autoload.py"
"autoload/krutrim_hermes_autoload.pth" = "krutrim_hermes_autoload.pth"
